<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aura AI — Your daily workspace for tasks, notes & time</title>
<meta name="description" content="Aura AI is a unified daily workspace: tasks with due dates and priority, a calendar, a time tracker, focus sessions, notes, and client invoicing — all in one place." />
<meta property="og:title" content="Aura AI — Your daily workspace" />
<meta property="og:description" content="One dashboard for tasks, calendar, time tracking, focus sessions, notes, and invoicing." />
<meta property="og:type" content="website" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#131B22;
    --panel:#1B252D;
    --panel-raised:#212C35;
    --line:#2C3944;
    --brass:#C99A52;
    --brass-dim:#8A6D3F;
    --signal:#6E9C7D;
    --danger:#B15C4A;
    --amber:#D2A24C;
    --parchment:#EDE7D9;
    --muted:#8695A0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--ink);
    color:var(--parchment);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #root{min-height:100vh;}
  h1,h2,h3{font-family:'Fraunces', serif; font-weight:500; margin:0;}
  .mono{font-family:'IBM Plex Mono', monospace;}
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  ::selection{background:var(--brass); color:var(--ink);}

  /* ---- Auth screen ---- */
  .auth-wrap{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px;
    background:
      radial-gradient(circle at 20% 15%, rgba(201,154,82,0.08), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(110,156,125,0.06), transparent 40%),
      var(--ink);
  }
  .auth-card{
    width:100%; max-width:400px;
    border:1px solid var(--line);
    background:var(--panel);
    padding:40px 36px;
    position:relative;
  }
  .auth-card::before{
    content:"";
    position:absolute; top:0; left:0; right:0; height:2px;
    background:linear-gradient(90deg, transparent, var(--brass), transparent);
  }
  .auth-mark{ display:flex; align-items:center; gap:10px; margin-bottom:28px; }
  .auth-mark .dot{width:8px; height:8px; border-radius:50%; background:var(--signal); box-shadow:0 0 8px var(--signal);}
  .auth-mark span{font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.08em; color:var(--muted);}
  .auth-card h1{font-size:28px; color:var(--parchment); margin-bottom:6px;}
  .auth-sub{color:var(--muted); font-size:14px; line-height:1.5; margin-bottom:28px;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:6px;}
  .field input{
    width:100%; background:var(--ink); border:1px solid var(--line);
    color:var(--parchment); padding:11px 12px; font-size:14px;
    outline:none; transition:border-color .15s;
  }
  .field input:focus{border-color:var(--brass);}
  .btn-primary{
    width:100%; background:var(--brass); color:var(--ink); border:none;
    padding:12px; font-size:14px; font-weight:600; margin-top:8px;
    transition:background .15s;
  }
  .btn-primary:hover{background:#DBAE68;}
  .btn-primary:disabled{opacity:0.5; cursor:default;}
  .auth-foot{margin-top:20px; font-size:12px; color:var(--muted); line-height:1.6;}
  .error-msg{
    background:rgba(177,92,74,0.12); border:1px solid var(--danger);
    color:#E2A392; font-size:13px; padding:10px 12px; margin-bottom:16px;
  }
  .info-msg{
    background:rgba(110,156,125,0.12); border:1px solid var(--signal);
    color:#B9D4C3; font-size:13px; padding:10px 12px; margin-bottom:16px; line-height:1.5;
  }
  .auth-foot a{ color:var(--brass); text-decoration:none; }
  .auth-foot a:hover{ text-decoration:underline; }

  /* ---- App shell ---- */
  .shell{display:flex; min-height:100vh;}
  .rail{
    width:220px; flex-shrink:0; background:var(--panel);
    border-right:1px solid var(--line);
    display:flex; flex-direction:column;
    padding:24px 0;
  }
  .rail-brand{padding:0 20px 24px; border-bottom:1px solid var(--line); margin-bottom:16px;}
  .rail-brand .dot{width:7px; height:7px; border-radius:50%; background:var(--signal); display:inline-block; margin-right:8px; box-shadow:0 0 6px var(--signal);}
  .rail-brand span{font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.08em; color:var(--muted);}
  .rail-brand h2{font-size:19px; margin-top:6px;}
  .nav-item{
    display:flex; align-items:center; gap:10px;
    padding:11px 20px; color:var(--muted); font-size:14px;
    border-left:2px solid transparent; cursor:pointer;
    transition:all .15s;
  }
  .nav-item:hover{color:var(--parchment); background:var(--panel-raised);}
  .nav-item.active{color:var(--brass); border-left-color:var(--brass); background:var(--panel-raised);}
  .rail-foot{margin-top:auto; padding:16px 20px 0; border-top:1px solid var(--line);}
  .rail-user{font-size:12px; color:var(--muted); margin-bottom:10px; word-break:break-all;}
  .rail-user b{color:var(--parchment); display:block; font-weight:500; margin-bottom:2px;}
  .logout-btn{
    background:none; border:1px solid var(--line); color:var(--muted);
    padding:8px 10px; font-size:12px; width:100%; transition:all .15s;
  }
  .logout-btn:hover{border-color:var(--danger); color:#E2A392;}

  .main{flex:1; padding:40px 48px; max-width:960px;}
  .page-head{margin-bottom:32px;}
  .page-head .eyebrow{font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--brass); letter-spacing:0.06em; margin-bottom:8px;}
  .page-head h1{font-size:32px;}
  .page-head p{color:var(--muted); font-size:14px; margin-top:8px;}

  .stat-row{display:flex; gap:1px; background:var(--line); border:1px solid var(--line); margin-bottom:32px;}
  .stat{flex:1; background:var(--panel); padding:18px 20px;}
  .stat .num{font-family:'Fraunces', serif; font-size:30px; color:var(--parchment);}
  .stat .lbl{font-size:12px; color:var(--muted); margin-top:4px;}

  /* task composer */
  .composer{ border:1px solid var(--line); background:var(--panel); padding:16px; margin-bottom:24px; }
  .composer-row1{ display:flex; gap:10px; margin-bottom:10px; }
  .composer-row1 input[type=text]{
    flex:1; background:var(--ink); border:1px solid var(--line);
    color:var(--parchment); padding:11px 12px; font-size:14px; outline:none;
  }
  .composer-row1 input[type=text]:focus{border-color:var(--brass);}
  .composer-row2{ display:flex; gap:10px; flex-wrap:wrap; }
  .composer-row2 > div{ display:flex; flex-direction:column; gap:4px; }
  .composer-row2 label{ font-size:10px; color:var(--muted); font-family:'IBM Plex Mono', monospace; letter-spacing:0.04em;}
  .composer-row2 input, .composer-row2 select{
    background:var(--ink); border:1px solid var(--line); color:var(--parchment);
    padding:8px 10px; font-size:13px; outline:none;
  }
  .composer-row2 input:focus, .composer-row2 select:focus{border-color:var(--brass);}
  .add-btn{
    background:var(--brass); color:var(--ink); border:none;
    padding:0 20px; font-size:14px; font-weight:600; align-self:flex-end; height:37px;
  }
  .add-btn:hover{background:#DBAE68;}

  /* filter bar */
  .filter-bar{ display:flex; gap:8px; align-items:center; margin-bottom:16px; flex-wrap:wrap; }
  .filter-bar select{
    background:var(--panel); border:1px solid var(--line); color:var(--parchment);
    padding:7px 10px; font-size:12px; outline:none;
  }
  .filter-bar .tag-chip-filter{
    font-family:'IBM Plex Mono', monospace; font-size:11px; padding:5px 10px;
    border:1px solid var(--line); color:var(--muted); cursor:pointer; background:none;
  }
  .filter-bar .tag-chip-filter.active{ border-color:var(--brass); color:var(--brass); }

  .task-list{border-top:1px solid var(--line);}
  .task-row{
    display:flex; align-items:flex-start; gap:14px;
    padding:14px 4px; border-bottom:1px solid var(--line);
  }
  .check{
    width:18px; height:18px; border:1px solid var(--muted); flex-shrink:0; margin-top:2px;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:all .15s;
  }
  .check.done{background:var(--signal); border-color:var(--signal);}
  .check.done::after{content:"✓"; font-size:12px; color:var(--ink);}
  .task-body{flex:1; min-width:0;}
  .task-text{font-size:14px;}
  .task-text.done{color:var(--muted); text-decoration:line-through;}
  .task-meta{ display:flex; gap:8px; align-items:center; margin-top:6px; flex-wrap:wrap; }
  .pill{
    font-family:'IBM Plex Mono', monospace; font-size:10px; padding:2px 7px;
    border:1px solid var(--line); color:var(--muted);
  }
  .pill.due{ color:var(--parchment); }
  .pill.due.overdue{ border-color:var(--danger); color:#E2A392; }
  .pill.priority-high{ border-color:var(--danger); color:#E2A392; }
  .pill.priority-medium{ border-color:var(--amber); color:var(--amber); }
  .pill.priority-low{ border-color:var(--signal); color:var(--signal); }
  .pill.tag{ color:var(--brass); border-color:var(--brass-dim); }
  .del-btn{
    background:none; border:none; color:var(--muted); font-size:16px;
    padding:4px 8px; opacity:0; transition:opacity .15s; flex-shrink:0;
  }
  .task-row:hover .del-btn{opacity:1;}
  .del-btn:hover{color:var(--danger);}
  .empty{color:var(--muted); font-size:14px; padding:24px 4px; text-align:center;}

  /* notes */
  .note-composer{ display:flex; flex-direction:column; gap:10px; margin-bottom:24px; }
  .note-composer textarea{
    background:var(--panel); border:1px solid var(--line); color:var(--parchment);
    padding:12px 14px; font-size:14px; outline:none; resize:vertical; min-height:80px;
    font-family:'IBM Plex Sans', sans-serif;
  }
  .note-composer textarea:focus{border-color:var(--brass);}
  .note-composer-foot{ display:flex; gap:10px; justify-content:space-between; align-items:center; }
  .note-composer input[type=text]{
    background:var(--panel); border:1px solid var(--line); color:var(--parchment);
    padding:9px 12px; font-size:13px; outline:none; width:220px;
  }
  .note-composer input[type=text]:focus{border-color:var(--brass);}
  .note-card{
    border:1px solid var(--line); background:var(--panel); padding:16px;
    margin-bottom:12px; position:relative;
  }
  .note-card .note-tag{
    font-family:'IBM Plex Mono', monospace; font-size:10px; color:var(--brass);
    margin-bottom:8px; display:inline-block;
  }
  .note-card .note-text{ font-size:14px; line-height:1.6; white-space:pre-wrap; }
  .note-card .note-time{ font-family:'IBM Plex Mono', monospace; font-size:10px; color:var(--muted); margin-top:10px; }
  .note-card .del-btn{ position:absolute; top:10px; right:10px; opacity:0; }
  .note-card:hover .del-btn{ opacity:1; }
  .note-search{ margin-bottom:20px; }
  .note-search input{
    width:100%; background:var(--panel); border:1px solid var(--line); color:var(--parchment);
    padding:10px 14px; font-size:13px; outline:none;
  }
  .note-search input:focus{ border-color:var(--brass); }
  .note-group{ margin-bottom:24px; }
  .note-group-label{
    font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--muted);
    letter-spacing:0.06em; margin-bottom:10px; padding-bottom:6px; border-bottom:1px solid var(--line);
  }
  .note-card .note-text{ cursor:text; }
  .note-card .note-text:hover{ color:var(--brass); }
  .note-edit-area{
    width:100%; background:var(--ink); border:1px solid var(--brass); color:var(--parchment);
    padding:10px 12px; font-size:14px; line-height:1.6; font-family:'IBM Plex Sans', sans-serif;
    outline:none; resize:vertical; min-height:70px;
  }
  .note-edit-actions{ display:flex; gap:8px; margin-top:8px; }

  /* ---- Notes sub-tabs ---- */
  .sub-tabs{ display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:24px; }
  .sub-tab{
    background:none; border:none; color:var(--muted); font-size:14px;
    padding:10px 16px; border-bottom:2px solid transparent; margin-bottom:-1px;
  }
  .sub-tab.active{ color:var(--brass); border-bottom-color:var(--brass); }
  .sub-tab:hover{ color:var(--parchment); }

  /* ---- Research AI ---- */
  .ai-key-gate{ border:1px solid var(--line); background:var(--panel); padding:24px; max-width:520px; }
  .ai-chat-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .ai-chat-window{
    border:1px solid var(--line); background:var(--panel); padding:16px;
    min-height:320px; max-height:480px; overflow-y:auto; margin-bottom:14px;
    display:flex; flex-direction:column; gap:14px;
  }
  .ai-empty{ color:var(--muted); font-size:13px; text-align:center; margin:auto; }
  .ai-bubble{ max-width:80%; }
  .ai-bubble.user{ align-self:flex-end; }
  .ai-bubble.assistant{ align-self:flex-start; }
  .ai-bubble-text{
    font-size:14px; line-height:1.6; padding:10px 14px; white-space:pre-wrap;
  }
  .ai-bubble.user .ai-bubble-text{ background:var(--brass); color:var(--ink); }
  .ai-bubble.assistant .ai-bubble-text{ background:var(--panel-raised); border:1px solid var(--line); color:var(--parchment); }
  .ai-bubble.assistant .copy-btn{ margin-top:6px; }
  .ai-typing{ color:var(--muted); font-style:italic; }
  .ai-input-row{ display:flex; gap:10px; }
  .ai-input-row input{
    flex:1; background:var(--panel); border:1px solid var(--line); color:var(--parchment);
    padding:11px 14px; font-size:14px; outline:none;
  }
  .ai-input-row input:focus{ border-color:var(--brass); }

  .admin-table{width:100%; border-collapse:collapse; margin-top:8px;}
  .admin-table th{
    text-align:left; font-size:11px; color:var(--muted); font-weight:500;
    padding:10px 12px; border-bottom:1px solid var(--line);
    font-family:'IBM Plex Mono', monospace; letter-spacing:0.04em;
  }
  .admin-table td{padding:12px; border-bottom:1px solid var(--line); font-size:14px;}
  .admin-table tr:hover td{background:var(--panel-raised);}
  .you-tag{
    font-family:'IBM Plex Mono', monospace; font-size:10px; color:var(--signal);
    border:1px solid var(--signal); padding:2px 6px; margin-left:8px;
  }
  .admin-note{
    border:1px solid var(--line); background:var(--panel);
    padding:14px 16px; font-size:13px; color:var(--muted); line-height:1.6; margin-bottom:24px;
  }
  .admin-note b{color:var(--brass);}
  .loading{color:var(--muted); font-size:13px; padding:20px 0;}

  /* ---- Due-today banner ---- */
  .due-banner{
    border:1px solid var(--brass-dim); background:rgba(201,154,82,0.08);
    padding:14px 18px; margin-bottom:24px;
  }
  .due-banner-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .due-banner-title{ font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--brass); letter-spacing:0.02em; }
  .due-banner-close{ background:none; border:none; color:var(--muted); font-size:14px; padding:2px 6px; }
  .due-banner-close:hover{ color:var(--parchment); }
  .due-banner-list{ display:flex; gap:8px; flex-wrap:wrap; }
  .due-banner-chip{
    font-size:12px; color:var(--parchment); background:var(--panel-raised);
    border:1px solid var(--line); padding:4px 10px;
  }
  .due-banner-chip.overdue{ border-color:var(--danger); color:#E2A392; }

  /* ---- Responsive: phones & narrow tablets ---- */
  @media (max-width: 760px){
    .shell{ flex-direction:column; }
    .rail{
      width:100%; flex-direction:row; align-items:center;
      padding:12px 0; overflow-x:auto; white-space:nowrap;
      border-right:none; border-bottom:1px solid var(--line);
    }
    .rail-brand{
      padding:0 16px; border-bottom:none; border-right:1px solid var(--line);
      margin-bottom:0; flex-shrink:0;
    }
    .rail-brand h2{ display:none; }
    .nav-item{
      padding:10px 14px; border-left:none; border-bottom:2px solid transparent;
      flex-shrink:0; font-size:13px;
    }
    .nav-item.active{ border-left:none; border-bottom-color:var(--brass); }
    .rail-foot{
      margin-top:0; padding:0 16px; border-top:none; border-left:1px solid var(--line);
      display:flex; align-items:center; gap:10px; flex-shrink:0;
    }
    .rail-user{ margin-bottom:0; font-size:11px; white-space:nowrap; }
    .rail-user b{ display:inline; margin-right:4px; }
    .logout-btn{ width:auto; padding:6px 10px; white-space:nowrap; }
    .main{ padding:20px 16px; max-width:100%; }
    .page-head h1{ font-size:24px; }
    .stat-row{ flex-direction:column; }
    .composer-row2{ flex-direction:column; align-items:stretch; }
    .composer-row2 > div{ width:100%; }
    .composer-row2 input, .composer-row2 select{ width:100% !important; }
    .add-btn{ width:100%; }
    .cal-day{ min-height:56px; padding:4px; }
    .cal-day-count{ display:none; }
    .cal-today-badge{ display:none; }
    .timer-panel{ flex-direction:column; align-items:stretch; }
    .invoice-form{ flex-direction:column; align-items:stretch; }
    .invoice-form input{ width:100% !important; }
    .review-grid{ grid-template-columns:1fr; }
    .focus-task{ font-size:20px; }
    .focus-ring{ width:170px; height:170px; }
    .entry-table{ font-size:12px; }
    .admin-table{ font-size:12px; }
    .auth-card{ padding:28px 22px; }
  }

  /* ---- Focus mode ---- */
  .focus-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column; padding:24px; background: var(--ink); }
  .focus-eyebrow{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--brass); letter-spacing:0.08em; margin-bottom:14px; }
  .focus-task{ font-size:26px; text-align:center; max-width:560px; margin-bottom:36px; }
  .focus-ring{ width:220px; height:220px; border-radius:50%; border:2px solid var(--line); display:flex; align-items:center; justify-content:center; margin-bottom:36px; position:relative; }
  .focus-ring .time{ font-family:'IBM Plex Mono', monospace; font-size:42px; color:var(--parchment); }
  .focus-btns{ display:flex; gap:12px; }
  .focus-btns button{ background:var(--panel); border:1px solid var(--line); color:var(--parchment); padding:11px 22px; font-size:14px; }
  .focus-btns button.primary{ background:var(--brass); color:var(--ink); border:none; font-weight:600; }
  .focus-btns button:hover{ border-color:var(--brass); }
  .focus-exit{ margin-top:28px; background:none; border:none; color:var(--muted); font-size:12px; text-decoration:underline; }
  .focus-empty{ color:var(--muted); font-size:14px; text-align:center; max-width:400px; }

  /* ---- Calendar ---- */
  .cal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .cal-head button{ background:var(--panel); border:1px solid var(--line); color:var(--parchment); padding:6px 12px; font-size:13px; }
  .cal-head button:hover{ border-color:var(--brass); }
  .cal-month{ font-family:'Fraunces', serif; font-size:18px; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:1px; background:var(--line); border:1px solid var(--line); }
  .cal-dow{ background:var(--panel); padding:8px; font-family:'IBM Plex Mono', monospace; font-size:10px; color:var(--muted); text-align:center; }
  .cal-day{ background:var(--panel); min-height:78px; padding:6px; position:relative; transition:background .15s; }
  .cal-day.other-month{ background:var(--ink); }
  .cal-day.today{ box-shadow:inset 0 0 0 1px var(--brass); }
  .cal-day.has-due{ background:rgba(201,154,82,0.07); }
  .cal-day.has-high{ background:rgba(177,92,74,0.10); }
  .cal-day.selected{ box-shadow:inset 0 0 0 2px var(--brass); }
  .cal-day:hover{ background:var(--panel-raised); }
  .cal-day-num{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  .cal-day.today .cal-day-num{ color:var(--brass); }
  .cal-today-badge{ font-size:8px; letter-spacing:0.04em; color:var(--brass); border:1px solid var(--brass); padding:1px 4px; }
  .cal-day-count{ font-family:'IBM Plex Mono', monospace; font-size:9px; color:var(--amber); margin-top:4px; }
  .cal-dot-row{ display:flex; flex-wrap:wrap; gap:3px; margin-top:6px; }
  .cal-dot{ width:6px; height:6px; border-radius:50%; }
  .cal-dot.p-high{ background:var(--danger); }
  .cal-dot.p-medium{ background:var(--amber); }
  .cal-dot.p-low{ background:var(--signal); }
  .cal-agenda{ margin-top:24px; }
  .cal-agenda-item{ display:flex; gap:10px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); font-size:13px; }
  .cal-agenda-item .dot{ width:6px; height:6px; border-radius:50%; flex-shrink:0; }

  /* ---- Timer ---- */
  .timer-panel{ border:1px solid var(--line); background:var(--panel); padding:20px; margin-bottom:24px; display:flex; align-items:center; gap:20px; flex-wrap:wrap; }
  .timer-panel select, .timer-panel input[type=text]{
    background:var(--ink); border:1px solid var(--line); color:var(--parchment);
    padding:9px 12px; font-size:13px; outline:none;
  }
  .timer-display{ font-family:'IBM Plex Mono', monospace; font-size:28px; color:var(--brass); min-width:110px; }
  .timer-panel button{ background:var(--signal); color:var(--ink); border:none; padding:10px 18px; font-size:13px; font-weight:600; }
  .timer-panel button.stop{ background:var(--danger); }
  .entry-table{ width:100%; border-collapse:collapse; }
  .entry-table th{ text-align:left; font-size:11px; color:var(--muted); font-family:'IBM Plex Mono', monospace; padding:8px 10px; border-bottom:1px solid var(--line); }
  .entry-table td{ padding:10px; border-bottom:1px solid var(--line); font-size:13px; }
  .entry-table td.num{ font-family:'IBM Plex Mono', monospace; }

  /* ---- Invoices ---- */
  .invoice-form{ display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; border:1px solid var(--line); background:var(--panel); padding:16px; margin-bottom:24px; }
  .invoice-form > div{ display:flex; flex-direction:column; gap:4px; }
  .invoice-form label{ font-size:10px; color:var(--muted); font-family:'IBM Plex Mono', monospace; }
  .invoice-form input{ background:var(--ink); border:1px solid var(--line); color:var(--parchment); padding:9px 10px; font-size:13px; outline:none; width:130px; }
  .invoice-summary{ border:1px solid var(--brass-dim); background:var(--panel-raised); padding:16px; margin-top:16px; font-family:'IBM Plex Mono', monospace; font-size:13px; white-space:pre-wrap; line-height:1.7; }
  .copy-btn{ background:none; border:1px solid var(--line); color:var(--muted); padding:6px 12px; font-size:12px; margin-top:10px; }
  .copy-btn:hover{ border-color:var(--brass); color:var(--brass); }

  /* ---- Weekly review ---- */
  .review-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:1px; background:var(--line); border:1px solid var(--line); margin-bottom:24px; }
  .review-cell{ background:var(--panel); padding:20px; }
  .review-cell .num{ font-family:'Fraunces', serif; font-size:36px; color:var(--brass); }
  .review-cell .lbl{ font-size:12px; color:var(--muted); margin-top:6px; }
  .review-list-item{ display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line); font-size:13px; }

</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script type="text/babel">
const {useState, useEffect, useMemo, useRef} = React;

/* ============================================================
   SUPABASE (REAL ACCOUNTS, ANY DEVICE) — optional but recommended.
   Without this filled in, the app falls back to saving accounts
   only in each visitor's own browser (see STORAGE SHIM below),
   which is why the same person sees "no account" on a different
   device or browser. Filling these in fixes that permanently.

   ONE-TIME SETUP (free):
   1. Go to supabase.com, create a free account and a new project.
   2. In the SQL Editor, run this once to create the tables:

        create table user_data (
          user_id uuid references auth.users(id) on delete cascade,
          key text not null,
          value text not null,
          updated_at timestamptz default now(),
          primary key (user_id, key)
        );
        alter table user_data enable row level security;
        create policy "owner access" on user_data
          for all using (auth.uid() = user_id) with check (auth.uid() = user_id);

        create table shared_data (
          key text primary key,
          value text not null,
          updated_at timestamptz default now()
        );
        alter table shared_data enable row level security;
        create policy "signed-in read/write" on shared_data
          for all using (auth.role() = 'authenticated') with check (auth.role() = 'authenticated');

   3. In Project Settings > API, copy the "Project URL" and the
      "anon public" key into the two lines below.
   4. In Authentication > URL Configuration, set the Site URL to
      your live Netlify link (e.g. https://cozy-pie-6006a4.netlify.app)
      — this is required for password-reset emails to redirect back
      to your app correctly.
   5. (Recommended for testing) In Authentication > Providers > Email,
      turn OFF "Confirm email" so new accounts can sign in right away
      instead of needing to click a confirmation link first.
   ============================================================ */
const SUPABASE_URL = "";
const SUPABASE_ANON_KEY = "";

const sb = (SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase)
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;

function isSupabaseConfigured(){ return !!sb; }

/* ============================================================
   STORAGE — routes through Supabase (real, cross-device) when
   configured above; otherwise falls back to this browser's own
   localStorage (each browser/device sees only its own data).
   ============================================================ */
if(isSupabaseConfigured()){
  window.storage = {
    async get(key, shared){
      const table = shared ? 'shared_data' : 'user_data';
      let query = sb.from(table).select('value').eq('key', key);
      if(!shared){
        const { data: { user } } = await sb.auth.getUser();
        if(!user) throw new Error('not authenticated');
        query = query.eq('user_id', user.id);
      }
      const { data, error } = await query.maybeSingle();
      if(error || !data) throw new Error('key not found');
      return {key, value: data.value, shared: !!shared};
    },
    async set(key, value, shared){
      const table = shared ? 'shared_data' : 'user_data';
      const row = { key, value };
      if(!shared){
        const { data: { user } } = await sb.auth.getUser();
        if(!user) throw new Error('not authenticated');
        row.user_id = user.id;
      }
      const { error } = await sb.from(table).upsert(row, { onConflict: shared ? 'key' : 'user_id,key' });
      if(error) throw error;
      return {key, value, shared: !!shared};
    },
    async delete(key, shared){
      const table = shared ? 'shared_data' : 'user_data';
      let query = sb.from(table).delete().eq('key', key);
      if(!shared){
        const { data: { user } } = await sb.auth.getUser();
        if(!user) throw new Error('not authenticated');
        query = query.eq('user_id', user.id);
      }
      const { error } = await query;
      if(error) throw error;
      return {key, deleted: true, shared: !!shared};
    },
    async list(prefix, shared){
      const table = shared ? 'shared_data' : 'user_data';
      let query = sb.from(table).select('key').ilike('key', (prefix||'') + '%');
      if(!shared){
        const { data: { user } } = await sb.auth.getUser();
        if(!user) throw new Error('not authenticated');
        query = query.eq('user_id', user.id);
      }
      const { data, error } = await query;
      if(error) throw error;
      return {keys: (data||[]).map(r=>r.key), prefix, shared: !!shared};
    }
  };
} else if(!window.storage){
  window.storage = {
    async get(key, shared){
      const k = (shared ? 'shared:' : 'priv:') + key;
      const v = localStorage.getItem(k);
      if(v === null) throw new Error('key not found');
      return {key, value: v, shared: !!shared};
    },
    async set(key, value, shared){
      const k = (shared ? 'shared:' : 'priv:') + key;
      localStorage.setItem(k, value);
      return {key, value, shared: !!shared};
    },
    async delete(key, shared){
      const k = (shared ? 'shared:' : 'priv:') + key;
      localStorage.removeItem(k);
      return {key, deleted: true, shared: !!shared};
    },
    async list(prefix, shared){
      const p = (shared ? 'shared:' : 'priv:') + (prefix || '');
      const keys = Object.keys(localStorage).filter(k => k.startsWith(p)).map(k => k.slice((shared?'shared:':'priv:').length));
      return {keys, prefix, shared: !!shared};
    }
  };
}


async function hashPassword(pw){
  const enc = new TextEncoder().encode(pw);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

function genResetCode(){
  return String(Math.floor(100000 + Math.random()*900000));
}

/* Generic transactional email sender via EmailJS — used for both
   password-reset codes and due-task reminders below. Requires the
   same one-time EmailJS setup (EMAILJS_PUBLIC_KEY / SERVICE_ID /
   TEMPLATE_ID). Your EmailJS template should include {{to_email}},
   {{subject}}, and {{message}} variables to support both use cases. */
async function sendTransactionalEmail(toEmail, subject, message, extraParams){
  if(!EMAILJS_PUBLIC_KEY || !EMAILJS_SERVICE_ID || !EMAILJS_TEMPLATE_ID) return false;
  try{
    await fetch("https://api.emailjs.com/api/v1.0/email/send", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        service_id: EMAILJS_SERVICE_ID,
        template_id: EMAILJS_TEMPLATE_ID,
        user_id: EMAILJS_PUBLIC_KEY,
        template_params: { to_email: toEmail, user_email: toEmail, subject, message, ...(extraParams||{}) }
      })
    });
    return true;
  }catch(e){ return false; }
}

async function sendResetCode(email, code){
  return await sendTransactionalEmail(
    email,
    "Your Aura AI password reset code",
    "Your verification code is: " + code + " (expires in 15 minutes).",
    { reset_code: code }
  );
}

async function sendDueTasksEmail(email, dueTasks){
  const lines = dueTasks.map(t => "• " + t.text + (t.overdue ? " (overdue)" : " (due today)"));
  const subject = dueTasks.length === 1
    ? "1 task needs your attention today"
    : dueTasks.length + " tasks need your attention today";
  const message = "Here's what's due:\n\n" + lines.join("\n");
  return await sendTransactionalEmail(email, subject, message, { due_count: dueTasks.length });
}

/* ============================================================
   EMAIL NOTIFICATION ON SIGNUP — sent via FormSubmit.co, a free
   form-to-email relay that needs NO developer account or API
   key — just the destination address below.

   ONE-TIME STEP: the very first signup attempt will make
   FormSubmit send a confirmation email to OWNER_EMAIL. Open that
   email and click "Confirm" — after that, every future signup is
   forwarded automatically, forever, with no further setup.

   Even if this step hasn't been done yet, every signup is still
   visible in-app on the "Registered users" page.
   ============================================================ */
const OWNER_EMAIL = "dharsankondal.k@gmail.com";

async function notifyOwnerOfSignup(name, email){
  try{
    await fetch("https://formsubmit.co/ajax/" + OWNER_EMAIL, {
      method: "POST",
      headers: {"Content-Type":"application/json", "Accept":"application/json"},
      body: JSON.stringify({
        _subject: "Aura AI — new signup: " + email,
        name: name,
        email: email,
        message: "New Aura AI account created.\nName: " + name + "\nEmail: " + email
      })
    });
  }catch(e){ /* best effort, never block signup on this */ }
}

/* Password-reset codes still need a real transactional email API
   (FormSubmit only forwards to the fixed OWNER_EMAIL above, not to
   arbitrary user addresses). Fill these in with a free EmailJS
   account (emailjs.com) if you want reset codes emailed to users;
   until then, the code is shown on-screen so resets still work. */
const EMAILJS_PUBLIC_KEY = "";
const EMAILJS_SERVICE_ID = "";
const EMAILJS_TEMPLATE_ID = "";

async function loadRegistry(){
  try{
    const res = await window.storage.get('registry', true);
    return res ? JSON.parse(res.value) : [];
  }catch(e){ return []; }
}
async function saveRegistry(registry){
  await window.storage.set('registry', JSON.stringify(registry), true);
}

function Auth({onSignedIn}){
  const supaMode = isSupabaseConfigured();

  const [tab, setTab] = useState('signin'); // signin | signup | forgot | forgot-verify | forgot-reset | check-email
  const [email, setEmail] = useState("");
  const [name, setName] = useState("");
  const [password, setPassword] = useState("");
  const [confirmPassword, setConfirmPassword] = useState("");
  const [code, setCode] = useState("");
  const [newPassword, setNewPassword] = useState("");
  const [confirmNewPassword, setConfirmNewPassword] = useState("");
  const [err, setErr] = useState("");
  const [info, setInfo] = useState("");
  const [busy, setBusy] = useState(false);

  function resetMessages(){ setErr(""); setInfo(""); }
  function switchTab(t){ resetMessages(); setTab(t); }

  async function handleSignIn(e){
    e.preventDefault();
    resetMessages();
    const cleanEmail = email.trim().toLowerCase();
    if(!cleanEmail || !password){ setErr("Enter your email and password."); return; }
    setBusy(true);
    try{
      if(supaMode){
        const { data, error } = await sb.auth.signInWithPassword({ email: cleanEmail, password });
        if(error){ setErr(error.message); setBusy(false); return; }
        onSignedIn({ email: cleanEmail, name: data.user.user_metadata?.name || cleanEmail });
      } else {
        const registry = await loadRegistry();
        const record = registry.find(u => u.email === cleanEmail);
        if(!record){ setErr("No account found for that email. Try Create account instead."); setBusy(false); return; }
        const hash = await hashPassword(password);
        if(hash !== record.passwordHash){ setErr("Incorrect password."); setBusy(false); return; }
        await window.storage.set('session', JSON.stringify({email: cleanEmail, name: record.name}), false);
        onSignedIn({email: cleanEmail, name: record.name, joinedAt: record.joinedAt});
      }
    }catch(err){
      setErr("Something went wrong signing you in. Try again.");
    }
    setBusy(false);
  }

  async function handleSignUp(e){
    e.preventDefault();
    resetMessages();
    const cleanEmail = email.trim().toLowerCase();
    const cleanName = name.trim();
    if(!cleanEmail || !cleanEmail.includes("@")){ setErr("Enter a valid email address."); return; }
    if(!cleanName){ setErr("Enter your name."); return; }
    if(password.length < 6){ setErr("Password must be at least 6 characters."); return; }
    if(password !== confirmPassword){ setErr("Passwords don't match."); return; }
    setBusy(true);
    try{
      if(supaMode){
        const { data, error } = await sb.auth.signUp({
          email: cleanEmail, password,
          options: { data: { name: cleanName } }
        });
        if(error){ setErr(error.message); setBusy(false); return; }
        notifyOwnerOfSignup(cleanName, cleanEmail);
        if(data.session){
          onSignedIn({ email: cleanEmail, name: cleanName });
        } else {
          setInfo("Account created. Check your email to confirm it, then sign in.");
          setTab('signin');
        }
      } else {
        const passwordHash = await hashPassword(password);
        const newRecord = {email: cleanEmail, name: cleanName, passwordHash, joinedAt: new Date().toISOString()};
        const registry = await loadRegistry();
        if(registry.some(u => u.email === cleanEmail)){
          setErr("An account with that email already exists. Try Sign in instead.");
          setBusy(false);
          return;
        }
        registry.push(newRecord);
        await saveRegistry(registry);
        await window.storage.set('session', JSON.stringify({email: cleanEmail, name: cleanName}), false);
        notifyOwnerOfSignup(cleanName, cleanEmail);
        onSignedIn(newRecord);
      }
    }catch(err){
      setErr("Something went wrong creating your account. Try again.");
    }
    setBusy(false);
  }

  async function handleForgotRequest(e){
    e.preventDefault();
    resetMessages();
    const cleanEmail = email.trim().toLowerCase();
    if(!cleanEmail){ setErr("Enter your email first."); return; }
    setBusy(true);
    try{
      if(supaMode){
        const { error } = await sb.auth.resetPasswordForEmail(cleanEmail, {
          redirectTo: window.location.origin + window.location.pathname
        });
        if(error){ setErr(error.message); setBusy(false); return; }
        setInfo("If an account exists for that email, a reset link has been sent. Check your inbox.");
        setTab('check-email');
      } else {
        const genCode = genResetCode();
        await window.storage.set('resetcode:'+cleanEmail, JSON.stringify({code: genCode, expires: Date.now() + 15*60*1000}), true);
        const emailed = await sendResetCode(cleanEmail, genCode);
        setInfo(emailed
          ? "A 6-digit code has been sent to " + cleanEmail + "."
          : "This app has no email backend configured yet, so here's your code directly: " + genCode);
        setTab('forgot-verify');
      }
    }catch(err){
      setErr("Couldn't send a reset code. Try again.");
    }
    setBusy(false);
  }

  async function handleVerifyCode(e){
    e.preventDefault();
    resetMessages();
    const cleanEmail = email.trim().toLowerCase();
    setBusy(true);
    try{
      const res = await window.storage.get('resetcode:'+cleanEmail, true);
      const stored = res ? JSON.parse(res.value) : null;
      if(!stored || stored.code !== code.trim() || Date.now() > stored.expires){
        setErr("That code is incorrect or has expired.");
        setBusy(false);
        return;
      }
      setTab('forgot-reset');
    }catch(err){
      setErr("Couldn't verify that code. Try again.");
    }
    setBusy(false);
  }

  async function handleResetPassword(e){
    e.preventDefault();
    resetMessages();
    if(newPassword.length < 6){ setErr("Password must be at least 6 characters."); return; }
    if(newPassword !== confirmNewPassword){ setErr("Passwords don't match."); return; }
    setBusy(true);
    try{
      const cleanEmail = email.trim().toLowerCase();
      const registry = await loadRegistry();
      const idx = registry.findIndex(u => u.email === cleanEmail);
      if(idx === -1){ setErr("Account not found."); setBusy(false); return; }
      registry[idx].passwordHash = await hashPassword(newPassword);
      await saveRegistry(registry);
      try{ await window.storage.delete('resetcode:'+cleanEmail, true); }catch(e){}
      setPassword(""); setNewPassword(""); setConfirmNewPassword(""); setCode("");
      setInfo("Password updated. Sign in with your new password.");
      setTab('signin');
    }catch(err){
      setErr("Something went wrong resetting your password. Try again.");
    }
    setBusy(false);
  }

  return (
    <div className="auth-wrap">
      <div className="auth-card">
        <div className="auth-mark"><span className="dot"></span><span>AURA AI · SIGN IN</span></div>

        {(tab === 'signin' || tab === 'signup') && (
          <div className="sub-tabs" style={{marginBottom:20}}>
            <button type="button" className={"sub-tab" + (tab==='signin' ? ' active':'')} onClick={()=>switchTab('signin')}>Sign in</button>
            <button type="button" className={"sub-tab" + (tab==='signup' ? ' active':'')} onClick={()=>switchTab('signup')}>Create account</button>
          </div>
        )}

        {tab === 'signin' && (
          <React.Fragment>
            <h1>Welcome back.</h1>
            <p className="auth-sub">Sign in with your email and password.</p>
            {err && <div className="error-msg">{err}</div>}
            {info && <div className="info-msg">{info}</div>}
            <form onSubmit={handleSignIn}>
              <div className="field">
                <label>Email address</label>
                <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="you@gmail.com" autoComplete="email" />
              </div>
              <div className="field">
                <label>Password</label>
                <input type="password" value={password} onChange={e=>setPassword(e.target.value)} placeholder="••••••••" autoComplete="current-password" />
              </div>
              <button className="btn-primary" type="submit" disabled={busy}>{busy ? "Signing in…" : "Sign in"}</button>
            </form>
            <div className="auth-foot"><a href="#" onClick={(e)=>{e.preventDefault(); switchTab('forgot');}}>Forgot password?</a></div>
          </React.Fragment>
        )}

        {tab === 'signup' && (
          <React.Fragment>
            <h1>Create your account.</h1>
            <p className="auth-sub">{supaMode ? "Works on any device once created." : "Saved in this browser."}</p>
            {err && <div className="error-msg">{err}</div>}
            <form onSubmit={handleSignUp}>
              <div className="field">
                <label>Your name</label>
                <input type="text" value={name} onChange={e=>setName(e.target.value)} placeholder="Alex Rivera" autoComplete="name" />
              </div>
              <div className="field">
                <label>Email address</label>
                <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="you@gmail.com" autoComplete="email" />
              </div>
              <div className="field">
                <label>Password</label>
                <input type="password" value={password} onChange={e=>setPassword(e.target.value)} placeholder="At least 6 characters" autoComplete="new-password" />
              </div>
              <div className="field">
                <label>Confirm password</label>
                <input type="password" value={confirmPassword} onChange={e=>setConfirmPassword(e.target.value)} placeholder="••••••••" autoComplete="new-password" />
              </div>
              <button className="btn-primary" type="submit" disabled={busy}>{busy ? "Creating…" : "Create account"}</button>
            </form>
          </React.Fragment>
        )}

        {tab === 'forgot' && (
          <React.Fragment>
            <h1>Reset your password.</h1>
            <p className="auth-sub">Enter the email on your account.</p>
            {err && <div className="error-msg">{err}</div>}
            <form onSubmit={handleForgotRequest}>
              <div className="field">
                <label>Email address</label>
                <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="you@gmail.com" autoFocus />
              </div>
              <button className="btn-primary" type="submit" disabled={busy}>{busy ? "Sending…" : "Send reset link"}</button>
            </form>
            <div className="auth-foot"><a href="#" onClick={(e)=>{e.preventDefault(); switchTab('signin');}}>← Back to sign in</a></div>
          </React.Fragment>
        )}

        {tab === 'check-email' && (
          <React.Fragment>
            <h1>Check your email.</h1>
            {info && <div className="info-msg">{info}</div>}
            <p className="auth-sub">Click the link we sent to finish resetting your password, then come back and sign in.</p>
            <div className="auth-foot"><a href="#" onClick={(e)=>{e.preventDefault(); switchTab('signin');}}>← Back to sign in</a></div>
          </React.Fragment>
        )}

        {tab === 'forgot-verify' && (
          <React.Fragment>
            <h1>Enter the code.</h1>
            <p className="auth-sub">Check your email for a 6-digit verification code.</p>
            {err && <div className="error-msg">{err}</div>}
            {info && <div className="info-msg">{info}</div>}
            <form onSubmit={handleVerifyCode}>
              <div className="field">
                <label>Verification code</label>
                <input type="text" value={code} onChange={e=>setCode(e.target.value)} placeholder="123456" maxLength={6} autoFocus />
              </div>
              <button className="btn-primary" type="submit" disabled={busy}>{busy ? "Verifying…" : "Verify code"}</button>
            </form>
            <div className="auth-foot">
              <a href="#" onClick={(e)=>{e.preventDefault(); handleForgotRequest(e);}}>Resend code</a>
              {" · "}
              <a href="#" onClick={(e)=>{e.preventDefault(); switchTab('signin');}}>← Back to sign in</a>
            </div>
          </React.Fragment>
        )}

        {tab === 'forgot-reset' && (
          <React.Fragment>
            <h1>Set a new password.</h1>
            <p className="auth-sub">Choose a new password for <b style={{color:'var(--parchment)'}}>{email}</b>.</p>
            {err && <div className="error-msg">{err}</div>}
            <form onSubmit={handleResetPassword}>
              <div className="field">
                <label>New password</label>
                <input type="password" value={newPassword} onChange={e=>setNewPassword(e.target.value)} placeholder="At least 6 characters" autoComplete="new-password" autoFocus />
              </div>
              <div className="field">

function daysUntil(dateStr){
  if(!dateStr) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const due = new Date(dateStr + "T00:00:00");
  return Math.round((due - today) / 86400000);
}

function dueLabel(dateStr){
  const d = daysUntil(dateStr);
  if(d === null) return null;
  if(d < 0) return {text: Math.abs(d) + "d overdue", overdue:true};
  if(d === 0) return {text: "Due today", overdue:false};
  if(d === 1) return {text: "Due tomorrow", overdue:false};
  return {text: "Due in " + d + "d", overdue:false};
}

function Tasks({user}){
  const [tasks, setTasks] = useState([]);
  const [loading, setLoading] = useState(true);
  const [text, setText] = useState("");
  const [due, setDue] = useState("");
  const [priority, setPriority] = useState("medium");
  const [tagInput, setTagInput] = useState("");
  const [tagFilter, setTagFilter] = useState(null);
  const [sortBy, setSortBy] = useState("due");

  const key = 'tasks:' + user.email;

  useEffect(() => {
    let cancelled = false;
    (async () => {
      try{
        const res = await window.storage.get(key, false);
        if(!cancelled) setTasks(res ? JSON.parse(res.value) : []);
      }catch(e){ if(!cancelled) setTasks([]); }
      if(!cancelled) setLoading(false);
    })();
    return () => { cancelled = true; };
  }, [key]);

  async function persist(next){
    setTasks(next);
    try{ await window.storage.set(key, JSON.stringify(next), false); }catch(e){}
  }

  function addTask(e){
    e.preventDefault();
    const t = text.trim();
    if(!t) return;
    const tags = tagInput.split(",").map(s=>s.trim()).filter(Boolean);
    const next = [{
      id: Date.now(), text: t, done:false, addedAt: new Date().toISOString(),
      due: due || null, priority, tags

    persist(next);

  }

  function toggle(id){ persist(tasks.map(t => t.id===id ? {...t, done:!t.done} : t)); }
  function remove(id){ persist(tasks.filter(t => t.id !== id)); }

  const allTags = useMemo(() => {

    tasks.forEach(t => (t.tags||[]).forEach(tag => s.add(tag)));

      list.sort((a,b) => new Date(b.addedAt) - new Date(a.addedAt));

  }, [tasks, tagFilter, sortBy]);

  const doneCount = tasks.filter(t=>t.done).length;

        <div className="stat"><div className="num">{overdueCount}</div><div className="lbl">Overdue</div></div>
        <div className="stat"><div className="num">{doneCount}</div><div className="lbl">Completed</div></div>
      </div>

      <form className="composer" onSubmit={addTask}>
        <div className="composer-row1">
          <input type="text" placeholder="What needs doing? (e.g. Draft literature review outline)" value={text} onChange={e=>setText(e.target.value)} />
        </div>
        <div className="composer-row2">
          <div>
            <label>DUE DATE</label>
            <input type="date" value={due} onChange={e=>setDue(e.target.value)} />
          </div>
          <div>
            <label>PRIORITY</label>
            <select value={priority} onChange={e=>setPriority(e.target.value)}>
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
            </select>
          </div>
          <div style={{flex:1, minWidth:160}}>
            <label>TAGS (comma separated)</label>
            <input type="text" placeholder="research, biology101, client-x" value={tagInput} onChange={e=>setTagInput(e.target.value)} style={{width:"100%"}} />
          </div>
          <button className="add-btn" type="submit">Add task</button>

      </form>

      {allTags.length > 0 && (
        <div className="filter-bar">
          <button className={"tag-chip-filter" + (tagFilter===null ? " active":"")} onClick={()=>setTagFilter(null)}>All tags</button>
          {allTags.map(tag => (
            <button key={tag} className={"tag-chip-filter" + (tagFilter===tag ? " active":"")} onClick={()=>setTagFilter(tag)}>{tag}</button>
          ))}
          <select value={sortBy} onChange={e=>setSortBy(e.target.value)} style={{marginLeft:"auto"}}>
            <option value="due">Sort: due date</option>
            <option value="priority">Sort: priority</option>
            <option value="newest">Sort: newest</option>
          </select>
        </div>
      )}

      {loading ? (
        <div className="loading">Loading your tasks…</div>
      ) : visible.length === 0 ? (
        <div className="empty">{tasks.length===0 ? "Nothing logged yet. Add your first task above." : "No tasks match this filter."}</div>
      ) : (
        <div className="task-list">
          {visible.map(t => {
            const dl = dueLabel(t.due);
            return (
              <div className="task-row" key={t.id}>
                <div className={"check" + (t.done ? " done":"")} onClick={()=>toggle(t.id)}></div>
                <div className="task-body">
                  <div className={"task-text" + (t.done ? " done":"")}>{t.text}</div>
                  <div className="task-meta">

                    <span className={"pill priority-" + t.priority}>{t.priority}</span>

          })}
        </div>
      )}
    </div>
  );
}

function groupByDate(items, dateField){
  const now = new Date();
  const today = now.toDateString();
  const yesterday = new Date(now); yesterday.setDate(now.getDate()-1);
  const yesterdayStr = yesterday.toDateString();
  const weekAgo = new Date(now); weekAgo.setDate(now.getDate()-7);

  const groups = {Today:[], Yesterday:[], 'This week':[], Earlier:[]};
  items.forEach(item => {
    const d = new Date(item[dateField]);
    if(d.toDateString() === today) groups['Today'].push(item);
    else if(d.toDateString() === yesterdayStr) groups['Yesterday'].push(item);
    else if(d >= weekAgo) groups['This week'].push(item);
    else groups['Earlier'].push(item);
  });
  return Object.entries(groups).filter(([,arr]) => arr.length > 0);
}

/* ============================================================
   RESEARCH ASSISTANT — a Claude/Gemini/ChatGPT-style chat panel.
   This file has no backend of its own, so it can't provide AI
   answers for free by itself. It calls the chosen provider's API
   directly from the browser using a key supplied once — stored
   only in that browser's local storage, never sent anywhere
   except straight to that provider.
   ============================================================ */
const AI_PROVIDERS = {
  claude:  { label: "Claude (Anthropic)",  placeholder: "sk-ant-…",         getKeyUrl: "console.anthropic.com" },
  openai:  { label: "ChatGPT (OpenAI)",    placeholder: "sk-…",             getKeyUrl: "platform.openai.com/api-keys" },
  gemini:  { label: "Gemini (Google)",     placeholder: "AIza…",            getKeyUrl: "aistudio.google.com/apikey" },
};

function apiError(message, status){
  const err = new Error(message);
  err.status = status;
  // Retry on rate limits (429) and server-side overload/errors (5xx).
  // Don't retry on bad requests or bad API keys (4xx other than 429) —
  // retrying those just repeats the same failure.
  err.retryable = status === 429 || status >= 500;
  return err;
}

async function askAIOnce(provider, apiKey, history){
  if(provider === 'openai'){
    const res = await fetch("https://api.openai.com/v1/chat/completions", {
      method: "POST",
      headers: {"Content-Type":"application/json", "Authorization":"Bearer "+apiKey},
      body: JSON.stringify({
        model: "gpt-4o-mini",
        messages: history.map(m => ({role: m.role, content: m.content}))
      })
    });
    if(!res.ok){
      const e = await res.json().catch(()=>({}));
      throw apiError(e?.error?.message || ("Request failed (" + res.status + ")"), res.status);
    }
    const data = await res.json();
    return data.choices?.[0]?.message?.content || "";
  }

  if(provider === 'gemini'){
    const res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=" + encodeURIComponent(apiKey), {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        contents: history.map(m => ({role: m.role === 'assistant' ? 'model' : 'user', parts: [{text: m.content}]}))
      })
    });
    if(!res.ok){
      const e = await res.json().catch(()=>({}));
      throw apiError(e?.error?.message || ("Request failed (" + res.status + ")"), res.status);
    }
    const data = await res.json();
    return (data.candidates?.[0]?.content?.parts || []).map(p => p.text || "").join("");
  }

  // default: claude
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "content-type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1024,
      messages: history.map(m => ({role: m.role, content: m.content}))
    })
  });
  if(!res.ok){
    const errBody = await res.json().catch(()=>({}));
    throw apiError(errBody?.error?.message || ("Request failed (" + res.status + ")"), res.status);
  }
  const data = await res.json();
  return (data.content || []).map(b => b.text || "").join("");
}

/* Automatic retry with exponential backoff — if the provider is
   temporarily overloaded (429/5xx, e.g. "high demand" errors),
   retry a few times with increasing delay instead of failing
   the first time. onRetry(attempt, max) lets the UI show progress. */
async function askAI(provider, apiKey, history, onRetry, retries=3, baseDelay=1500){
  for(let attempt=1; attempt<=retries; attempt++){
    try{
      return await askAIOnce(provider, apiKey, history);
    }catch(err){
      const isLastAttempt = attempt === retries;
      if(!err.retryable || isLastAttempt) throw err;
      if(onRetry) onRetry(attempt, retries);
      const delay = baseDelay * attempt; // 1.5s, 3s, 4.5s...
      await new Promise(resolve => setTimeout(resolve, delay));
    }
  }
}

function ResearchAI({user}){
  const [provider, setProvider] = useState("claude");
  const [apiKey, setApiKey] = useState("");
  const [providerChoice, setProviderChoice] = useState("claude");
  const [keyInput, setKeyInput] = useState("");
  const [messages, persistMessages, loadingMsgs] = useUserStore(user, 'aiChat', []);
  const [draft, setDraft] = useState("");
  const [sending, setSending] = useState(false);
  const [error, setError] = useState("");
  const [retryStatus, setRetryStatus] = useState("");
  const scrollRef = useRef(null);

  useEffect(() => {
    const savedKey = localStorage.getItem('priv:aura_ai_api_key');
    const savedProvider = localStorage.getItem('priv:aura_ai_provider');
    if(savedKey){ setApiKey(savedKey); setProvider(savedProvider || 'claude'); }
  }, []);

  useEffect(() => {
    if(scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [messages, sending]);

  function saveKey(e){
    e.preventDefault();
    const k = keyInput.trim();
    if(!k) return;
    localStorage.setItem('priv:aura_ai_api_key', k);
    localStorage.setItem('priv:aura_ai_provider', providerChoice);
    setApiKey(k);
    setProvider(providerChoice);
    setKeyInput("");
  }

  function clearKey(){
    localStorage.removeItem('priv:aura_ai_api_key');
    localStorage.removeItem('priv:aura_ai_provider');
    setApiKey("");
  }

  async function send(e){
    e.preventDefault();
    const q = draft.trim();
    if(!q || sending) return;
    setError("");
    setRetryStatus("");
    const next = [...messages, {role:'user', content:q, id: Date.now()}];
    persistMessages(next);
    setDraft("");
    setSending(true);
    try{
      const replyText = await askAI(provider, apiKey, next, (attempt, max) => {
        setRetryStatus("The provider is busy — retrying (" + attempt + "/" + (max-1) + ")…");
      });
      persistMessages([...next, {role:'assistant', content: replyText, id: Date.now()+1}]);
    }catch(err){
      setError(err.message || "Something went wrong reaching the AI provider.");
    }
    setRetryStatus("");
    setSending(false);
  }

  async function saveAsNote(content){
    try{
      const k2 = 'notes:' + user.email;
      let notes = [];
      try{
        const res = await window.storage.get(k2, false);
        notes = res ? JSON.parse(res.value) : [];
      }catch(e){}
      notes = [{id: Date.now(), text: content, tag: 'research', addedAt: new Date().toISOString(), updatedAt: new Date().toISOString()}, ...notes];
      await window.storage.set(k2, JSON.stringify(notes), false);
    }catch(e){}
  }

  if(!apiKey){
    const meta = AI_PROVIDERS[providerChoice];
    return (
      <div className="ai-key-gate">
        <div className="eyebrow">ONE-TIME SETUP</div>
        <h3 style={{fontSize:20, marginBottom:10}}>Connect an AI provider</h3>
        <p style={{color:'var(--muted)', fontSize:13, lineHeight:1.6, marginBottom:18}}>
          Pick whichever AI you already have a key for. It's saved only on this device and sent only to that provider when you ask a question.
        </p>
        <form onSubmit={saveKey}>
          <div className="field">
            <label>PROVIDER</label>
            <select value={providerChoice} onChange={e=>setProviderChoice(e.target.value)} style={{width:"100%"}}>
              {Object.entries(AI_PROVIDERS).map(([id, p]) => <option key={id} value={id}>{p.label}</option>)}
            </select>
          </div>
          <div className="field">
            <label>API KEY</label>
            <input type="password" placeholder={meta.placeholder} value={keyInput} onChange={e=>setKeyInput(e.target.value)} />
          </div>
          <p style={{color:'var(--muted)', fontSize:12, marginBottom:14}}>
            Get a key at <span className="mono" style={{color:'var(--brass)'}}>{meta.getKeyUrl}</span>
          </p>
          <button className="btn-primary" type="submit">Connect</button>
        </form>
      </div>
    );
  }

  return (
    <div>
      <div className="ai-chat-head">
        <span className="mono" style={{fontSize:11, color:'var(--muted)'}}>Connected to {AI_PROVIDERS[provider]?.label || provider}</span>
        <button className="copy-btn" onClick={clearKey}>Disconnect key</button>
      </div>
      <div className="ai-chat-window" ref={scrollRef}>
        {loadingMsgs ? <div className="loading">Loading conversation…</div> : messages.length === 0 ? (
          <div className="ai-empty">Ask a research question — sources to check, a concept to explain, an outline to start from.</div>
        ) : messages.map(m => (
          <div key={m.id} className={"ai-bubble " + m.role}>
            <div className="ai-bubble-text">{m.content}</div>
            {m.role === 'assistant' && (
              <button className="copy-btn" onClick={()=>saveAsNote(m.content)}>Save to notes</button>
            )}
          </div>
        ))}
        {sending && <div className="ai-bubble assistant"><div className="ai-bubble-text ai-typing">{retryStatus || "Thinking…"}</div></div>}
      </div>
      {error && <div className="error-msg">{error}</div>}
      <form className="ai-input-row" onSubmit={send}>
        <input type="text" placeholder="Ask a research question…" value={draft} onChange={e=>setDraft(e.target.value)} disabled={sending} />
        <button className="add-btn" type="submit" disabled={sending || !draft.trim()}>Send</button>
      </form>
    </div>
  );
}

}

/* ---- shared helper: load/save any per-user JSON key ---- */
function useUserStore(user, name, fallback){
  const [data, setData] = useState(fallback);
  const [loading, setLoading] = useState(true);
  const key = name + ':' + user.email;
  useEffect(() => {
    let cancelled = false;
    (async () => {
      try{
        const res = await window.storage.get(key, false);
        if(!cancelled) setData(res ? JSON.parse(res.value) : fallback);
      }catch(e){ if(!cancelled) setData(fallback); }
      if(!cancelled) setLoading(false);
    })();
    return () => { cancelled = true; };
  }, [key]);
  async function persist(next){
    setData(next);
    try{ await window.storage.set(key, JSON.stringify(next), false); }catch(e){}
  }
  return [data, persist, loading];
}

function Calendar({user}){
  const [tasks,, loadingTasks] = useUserStore(user, 'tasks', []);
  const [cursor, setCursor] = useState(() => { const d = new Date(); d.setDate(1); return d; });
  const [selectedDay, setSelectedDay] = useState(null);

  const year = cursor.getFullYear(), month = cursor.getMonth();
  const firstDow = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const daysInPrevMonth = new Date(year, month, 0).getDate();
  const todayStr = new Date().toDateString();

  const tasksByDate = useMemo(() => {
    const map = {};
    tasks.forEach(t => { if(t.due){ (map[t.due] = map[t.due] || []).push(t); } });
    return map;
  }, [tasks]);

  const cells = [];
  for(let i=firstDow-1; i>=0; i--) cells.push({day: daysInPrevMonth-i, other:true});
  for(let d=1; d<=daysInMonth; d++) cells.push({day:d, other:false, dateObj:new Date(year,month,d)});
  while(cells.length % 7 !== 0) cells.push({day: cells.length, other:true});

  function isoOf(dateObj){
    const y=dateObj.getFullYear(), m=String(dateObj.getMonth()+1).padStart(2,'0'), d=String(dateObj.getDate()).padStart(2,'0');
    return y+'-'+m+'-'+d;
  }

  const agenda = selectedDay ? (tasksByDate[selectedDay] || []) : [];

  return (
    <div>
      <div className="page-head">
        <div className="eyebrow">SCHEDULE</div>
        <h1>Calendar</h1>
        <p>Every task with a due date, laid out by month. Click a day to see what's on it.</p>
      </div>
      <div className="cal-head">
        <button onClick={()=>setCursor(new Date(year, month-1, 1))}>← Prev</button>
        <div className="cal-month">{cursor.toLocaleDateString(undefined,{month:'long', year:'numeric'})}</div>
        <button onClick={()=>setCursor(new Date(year, month+1, 1))}>Next →</button>
      </div>
      {loadingTasks ? <div className="loading">Loading…</div> : (
        <div className="cal-grid">
          {['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d => <div className="cal-dow" key={d}>{d}</div>)}
          {cells.map((c, i) => {
            const iso = c.dateObj ? isoOf(c.dateObj) : null;
            const dayTasks = iso ? (tasksByDate[iso] || []) : [];
            const isToday = c.dateObj && c.dateObj.toDateString() === todayStr;
            const hasHigh = dayTasks.some(t => t.priority === 'high' && !t.done);
            const hasAny = dayTasks.some(t => !t.done);
            const isSelected = iso && selectedDay === iso;
            return (
              <div key={i}
                   className={"cal-day" + (c.other ? " other-month":"") + (isToday ? " today":"") + (hasAny ? " has-due":"") + (hasHigh ? " has-high":"") + (isSelected ? " selected":"")}
                   style={{cursor: iso ? 'pointer':'default'}}
                   onClick={() => iso && setSelectedDay(iso)}>
                <div className="cal-day-num">{c.day}{isToday && <span className="cal-today-badge">TODAY</span>}</div>
                {dayTasks.length > 0 && (
                  <div className="cal-day-count">{dayTasks.length} due</div>
                )}
                <div className="cal-dot-row">
                  {dayTasks.slice(0,6).map(t => <div key={t.id} className={"cal-dot p-"+t.priority}></div>)}
                </div>
              </div>
            );
          })}
        </div>
      )}
      {selectedDay && (
        <div className="cal-agenda">
          <h3 style={{fontSize:16, marginBottom:8}}>{new Date(selectedDay+"T00:00:00").toLocaleDateString(undefined,{weekday:'long', month:'long', day:'numeric'})}</h3>
          {agenda.length === 0 ? <div className="empty">Nothing due this day.</div> : agenda.map(t => (
            <div className="cal-agenda-item" key={t.id}>
              <div className={"dot p-"+t.priority} style={{background: t.priority==='high' ? 'var(--danger)' : t.priority==='medium' ? 'var(--amber)' : 'var(--signal)'}}></div>
              <span style={{textDecoration: t.done ? 'line-through':'none', color: t.done ? 'var(--muted)':'inherit'}}>{t.text}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function formatHMS(sec){
  const h = String(Math.floor(sec/3600)).padStart(2,'0');
  const m = String(Math.floor((sec%3600)/60)).padStart(2,'0');
  const s = String(Math.floor(sec%60)).padStart(2,'0');
  return h+':'+m+':'+s;
}

function TimeTracker({user}){
  const [entries, persistEntries, loading] = useUserStore(user, 'timeEntries', []);
  const [label, setLabel] = useState("");
  const [running, setRunning] = useState(null); // {label, startedAt}
  const [elapsed, setElapsed] = useState(0);
  const tickRef = useRef(null);

  useEffect(() => {
    if(running){
      tickRef.current = setInterval(() => {
        setElapsed(Math.floor((Date.now() - running.startedAt) / 1000));
      }, 1000);
    } else {
      clearInterval(tickRef.current);
      setElapsed(0);
    }
    return () => clearInterval(tickRef.current);
  }, [running]);

  function start(){
    const l = label.trim() || "Untitled session";
    setRunning({label: l, startedAt: Date.now()});
  }

  function stop(){
    if(!running) return;
    const durationSec = Math.floor((Date.now() - running.startedAt) / 1000);
    const entry = {id: Date.now(), label: running.label, durationSec, date: new Date().toISOString()};
    persistEntries([entry, ...entries]);
    setRunning(null);
    setLabel("");
  }

  const now = new Date();
  const startOfWeek = new Date(now); startOfWeek.setDate(now.getDate() - now.getDay()); startOfWeek.setHours(0,0,0,0);
  const todayTotal = entries.filter(e => new Date(e.date).toDateString() === now.toDateString()).reduce((a,e)=>a+e.durationSec,0);
  const weekTotal = entries.filter(e => new Date(e.date) >= startOfWeek).reduce((a,e)=>a+e.durationSec,0);

  return (
    <div>
      <div className="page-head">
        <div className="eyebrow">TIME LOG</div>
        <h1>Time tracker</h1>
        <p>Start a timer on whatever you're working on — client, task, or project.</p>
      </div>
      <div className="stat-row">
        <div className="stat"><div className="num mono">{formatHMS(todayTotal)}</div><div className="lbl">Logged today</div></div>
        <div className="stat"><div className="num mono">{formatHMS(weekTotal)}</div><div className="lbl">Logged this week</div></div>
        <div className="stat"><div className="num">{entries.length}</div><div className="lbl">Sessions total</div></div>
      </div>
      <div className="timer-panel">
        {running ? (
          <React.Fragment>
            <div className="timer-display">{formatHMS(elapsed)}</div>
            <div style={{flex:1}}>{running.label}</div>
            <button className="stop" onClick={stop}>Stop</button>
          </React.Fragment>
        ) : (
          <React.Fragment>
            <input type="text" placeholder="What are you working on? (e.g. Client X — design review)" value={label} onChange={e=>setLabel(e.target.value)} style={{flex:1}} />
            <button onClick={start}>Start timer</button>
          </React.Fragment>
        )}
      </div>
      {loading ? <div className="loading">Loading…</div> : entries.length === 0 ? (
        <div className="empty">No sessions logged yet.</div>
      ) : (
        <table className="entry-table">
          <thead><tr><th>Session</th><th>Duration</th><th>Date</th></tr></thead>
          <tbody>
            {entries.map(e => (
              <tr key={e.id}>
                <td>{e.label}</td>
                <td className="num mono">{formatHMS(e.durationSec)}</td>
                <td className="num mono">{new Date(e.date).toLocaleDateString(undefined,{month:'short', day:'numeric'})}</td>
              </tr>
            ))}
          </tbody>
        </table>
      )}
    </div>
  );
}

function FocusMode({user, onExit}){
  const [tasks,, loadingTasks] = useUserStore(user, 'tasks', []);
  const [seconds, setSeconds] = useState(25*60);
  const [active, setActive] = useState(false);
  const tickRef = useRef(null);

  useEffect(() => {
    if(active && seconds > 0){
      tickRef.current = setInterval(() => setSeconds(s => s-1), 1000);
    } else {
      clearInterval(tickRef.current);
    }
    return () => clearInterval(tickRef.current);
  }, [active, seconds]);

  const topTask = useMemo(() => {
    const open = tasks.filter(t => !t.done);
    if(open.length === 0) return null;
    const rank = {high:0, medium:1, low:2};
    return open.slice().sort((a,b) => {
      const pr = rank[a.priority]-rank[b.priority];
      if(pr !== 0) return pr;
      if(!a.due && !b.due) return 0;
      if(!a.due) return 1;
      if(!b.due) return -1;
      return new Date(a.due)-new Date(b.due);
    })[0];
  }, [tasks]);

  const mins = String(Math.floor(seconds/60)).padStart(2,'0');
  const secs = String(seconds%60).padStart(2,'0');

  if(loadingTasks) return <div className="focus-wrap"><div className="loading">Loading…</div></div>;

  if(!topTask){
    return (
      <div className="focus-wrap">
        <div className="focus-eyebrow">FOCUS MODE</div>
        <p className="focus-empty">No open tasks to focus on. Add one from the Tasks page first.</p>
        <button className="focus-exit" onClick={onExit}>← Back to dashboard</button>
      </div>
    );
  }

  return (
    <div className="focus-wrap">
      <div className="focus-eyebrow">FOCUS MODE · TOP PRIORITY</div>
      <div className="focus-task">{topTask.text}</div>
      <div className="focus-ring"><div className="time mono">{mins}:{secs}</div></div>
      <div className="focus-btns">
        {!active ? (
          <button className="primary" onClick={()=>setActive(true)}>{seconds===25*60 ? "Start session":"Resume"}</button>
        ) : (
          <button onClick={()=>setActive(false)}>Pause</button>
        )}
        <button onClick={()=>{setActive(false); setSeconds(25*60);}}>Reset</button>
      </div>
      <button className="focus-exit" onClick={onExit}>← Exit focus mode</button>
    </div>
  );
}

function Invoices({user}){
  const [entries, persistEntries, loading] = useUserStore(user, 'invoiceEntries', []);
  const [client, setClient] = useState("");
  const [hours, setHours] = useState("");
  const [rate, setRate] = useState("");
  const [desc, setDesc] = useState("");
  const [summary, setSummary] = useState("");

  function addEntry(e){
    e.preventDefault();
    const h = parseFloat(hours), r = parseFloat(rate);
    if(!client.trim() || isNaN(h) || h<=0) return;
    const entry = {id: Date.now(), client: client.trim(), hours: h, rate: isNaN(r)?0:r, desc: desc.trim(), date: new Date().toISOString()};
    persistEntries([entry, ...entries]);
    setHours(""); setDesc("");
  }

  function remove(id){ persistEntries(entries.filter(e => e.id !== id)); }

  const clients = useMemo(() => Array.from(new Set(entries.map(e=>e.client))), [entries]);

  function generateSummary(clientName){
    const rows = entries.filter(e => e.client === clientName);
    const totalHours = rows.reduce((a,e)=>a+e.hours,0);
    const totalDue = rows.reduce((a,e)=>a+(e.hours*e.rate),0);
    const now = new Date();
    let out = "MONTHLY SUMMARY — " + clientName + "\n";
    out += "Generated " + now.toLocaleDateString() + "\n";
    out += "------------------------------------\n";
    rows.forEach(r => {
      out += (new Date(r.date).toLocaleDateString(undefined,{month:'short',day:'numeric'})) + "  " + r.hours + "h";
      if(r.rate) out += "  @ $" + r.rate + "/hr";
      if(r.desc) out += "  — " + r.desc;
      out += "\n";
    });
    out += "------------------------------------\n";
    out += "Total hours: " + totalHours + "\n";
    if(totalDue > 0) out += "Total due: $" + totalDue.toFixed(2) + "\n";
    setSummary(out);
  }

  return (
    <div>
      <div className="page-head">
        <div className="eyebrow">BILLING</div>
        <h1>Clients &amp; invoices</h1>
        <p>Log hours per client, then generate a plain-text summary you can paste into an invoice or email.</p>
      </div>
      <form className="invoice-form" onSubmit={addEntry}>
        <div><label>CLIENT</label><input type="text" placeholder="Client name" value={client} onChange={e=>setClient(e.target.value)} /></div>
        <div><label>HOURS</label><input type="number" step="0.25" placeholder="2.5" value={hours} onChange={e=>setHours(e.target.value)} style={{width:80}} /></div>
        <div><label>RATE ($/hr, optional)</label><input type="number" step="1" placeholder="50" value={rate} onChange={e=>setRate(e.target.value)} style={{width:80}} /></div>
        <div style={{flex:1, minWidth:160}}><label>DESCRIPTION</label><input type="text" placeholder="What did you work on?" value={desc} onChange={e=>setDesc(e.target.value)} style={{width:"100%"}} /></div>
        <button className="add-btn" type="submit">Log entry</button>
      </form>
      {loading ? <div className="loading">Loading…</div> : entries.length === 0 ? (
        <div className="empty">No hours logged yet.</div>
      ) : (
        <React.Fragment>
          <table className="entry-table">
            <thead><tr><th>Client</th><th>Hours</th><th>Rate</th><th>Description</th><th>Date</th><th></th></tr></thead>
            <tbody>
              {entries.map(e => (
                <tr key={e.id}>
                  <td>{e.client}</td>
                  <td className="num mono">{e.hours}</td>
                  <td className="num mono">{e.rate ? "$"+e.rate : "—"}</td>
                  <td>{e.desc || "—"}</td>
                  <td className="num mono">{new Date(e.date).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</td>
                  <td><button className="del-btn" style={{opacity:1}} onClick={()=>remove(e.id)}>✕</button></td>
                </tr>
              ))}
            </tbody>
          </table>
          <div className="filter-bar" style={{marginTop:20}}>
            {clients.map(c => (
              <button key={c} className="tag-chip-filter" onClick={()=>generateSummary(c)}>Generate summary — {c}</button>
            ))}
          </div>
          {summary && (
            <div>
              <div className="invoice-summary">{summary}</div>
              <button className="copy-btn" onClick={()=>navigator.clipboard.writeText(summary)}>Copy to clipboard</button>
            </div>
          )}
        </React.Fragment>
      )}
    </div>
  );
}

function WeeklyReview({user}){

  const [entries,, loadingTime] = useUserStore(user, 'timeEntries', []);
  const [notes,, loadingNotes] = useUserStore(user, 'notes', []);

  const now = new Date();
  const weekAgo = new Date(now); weekAgo.setDate(now.getDate()-7);

  const completedThisWeek = tasks.filter(t => t.done && new Date(t.addedAt) >= weekAgo).length;
  const addedThisWeek = tasks.filter(t => new Date(t.addedAt) >= weekAgo).length;
  const hoursThisWeek = entries.filter(e => new Date(e.date) >= weekAgo).reduce((a,e)=>a+e.durationSec,0);
  const notesThisWeek = notes.filter(n => new Date(n.addedAt) >= weekAgo).length;
  const loading = loadingTasks || loadingTime || loadingNotes;

  return (
    <div>
      <div className="page-head">
        <div className="eyebrow">WEEKLY REVIEW</div>
        <h1>Your last 7 days</h1>

          <div className="review-cell"><div className="num">{notesThisWeek}</div><div className="lbl">Notes captured</div></div>
        </div>

  );

/* ============================================================
   DUE-TODAY BANNER — shows at the top of the dashboard the moment
   someone opens the app on or after a task's due date. Also fires
   at most one reminder email per person per day (via the same
   EmailJS setup used for password resets) if it's configured —
   the banner itself always works even without that setup.
   ============================================================ */
function DueTodayBanner({user}){
  const [tasks,, loading] = useUserStore(user, 'tasks', []);
  const [dismissed, setDismissed] = useState(false);

  const dueList = useMemo(() => {
    return tasks
      .filter(t => !t.done && t.due && daysUntil(t.due) <= 0)
      .map(t => ({...t, overdue: daysUntil(t.due) < 0}))
      .sort((a,b) => new Date(a.due) - new Date(b.due));
  }, [tasks]);

  useEffect(() => {
    if(loading || dueList.length === 0) return;
    const todayKey = new Date().toDateString();
    const sentFlagKey = 'priv:aura_due_email_sent:' + user.email + ':' + todayKey;
    if(localStorage.getItem(sentFlagKey)) return;
    (async () => {
      const sent = await sendDueTasksEmail(user.email, dueList);
      if(sent) localStorage.setItem(sentFlagKey, '1');
    })();
  }, [loading, dueList, user.email]);

  if(loading || dueList.length === 0 || dismissed) return null;

  const overdueCount = dueList.filter(t => t.overdue).length;

  return (
    <div className="due-banner">
      <div className="due-banner-head">
        <span className="due-banner-title">
          {overdueCount > 0
            ? (dueList.length + " task" + (dueList.length>1?"s":"") + " need attention — " + overdueCount + " overdue")
            : (dueList.length + " task" + (dueList.length>1?"s":"") + " due today")}
        </span>
        <button className="due-banner-close" onClick={()=>setDismissed(true)}>✕</button>
      </div>
      <div className="due-banner-list">
        {dueList.slice(0,4).map(t => (
          <span key={t.id} className={"due-banner-chip" + (t.overdue ? " overdue":"")}>{t.text}</span>
        ))}
        {dueList.length > 4 && <span className="due-banner-chip">+{dueList.length-4} more</span>}
      </div>
    </div>
  );
}

function App(){
  const [user, setUser] = useState(null);
  const [checking, setChecking] = useState(true);
  const [recoveryMode, setRecoveryMode] = useState(false);
  const [newPw, setNewPw] = useState("");
  const [confirmPw, setConfirmPw] = useState("");
  const [pwErr, setPwErr] = useState("");
  const [pwBusy, setPwBusy] = useState(false);
  const [pwDone, setPwDone] = useState(false);

  useEffect(() => {
    if(isSupabaseConfigured()){
      // Restore an existing Supabase session, and watch for the
      // password-recovery event fired after clicking a reset-link email.
      sb.auth.getSession().then(({data}) => {
        const su = data.session?.user;
        if(su) setUser({email: su.email, name: su.user_metadata?.name || su.email});
        setChecking(false);
      });
      const { data: sub } = sb.auth.onAuthStateChange((event, session) => {
        if(event === 'PASSWORD_RECOVERY'){
          setRecoveryMode(true);
        } else if(event === 'SIGNED_IN' && session?.user){
          setUser({email: session.user.email, name: session.user.user_metadata?.name || session.user.email});
        } else if(event === 'SIGNED_OUT'){
          setUser(null);
        }
      });
      return () => { sub?.subscription?.unsubscribe(); };
    } else {
      (async () => {
        try{
          const res = await window.storage.get('session', false);
          if(res){
            const s = JSON.parse(res.value);
            setUser({email: s.email, name: s.name});
          }
        }catch(e){}
        setChecking(false);
      })();
    }
  }, []);

  async function handleSignOut(){
    if(isSupabaseConfigured()){
      try{ await sb.auth.signOut(); }catch(e){}
    } else {
      try{ await window.storage.delete('session', false); }catch(e){}
    }
    setUser(null);
  }

  async function handleSetRecoveredPassword(e){
    e.preventDefault();
    setPwErr("");
    if(newPw.length < 6){ setPwErr("Password must be at least 6 characters."); return; }
    if(newPw !== confirmPw){ setPwErr("Passwords don't match."); return; }
    setPwBusy(true);
    const { error } = await sb.auth.updateUser({ password: newPw });
    setPwBusy(false);
    if(error){ setPwErr(error.message); return; }
    setPwDone(true);
    setTimeout(() => { setRecoveryMode(false); setPwDone(false); }, 1800);
  }

  if(checking) return null;

  if(recoveryMode){
    return (
      <div className="auth-wrap">
        <div className="auth-card">
          <div className="auth-mark"><span className="dot"></span><span>AURA AI · RESET PASSWORD</span></div>
          <h1>Set a new password.</h1>
          {pwDone ? (
            <div className="info-msg">Password updated. Continuing…</div>
          ) : (
            <React.Fragment>
              <p className="auth-sub">You clicked a reset link — choose a new password below.</p>
              {pwErr && <div className="error-msg">{pwErr}</div>}
              <form onSubmit={handleSetRecoveredPassword}>
                <div className="field">
                  <label>New password</label>
                  <input type="password" value={newPw} onChange={e=>setNewPw(e.target.value)} placeholder="At least 6 characters" autoFocus />
                </div>
                <div className="field">
                  <label>Confirm new password</label>
                  <input type="password" value={confirmPw} onChange={e=>setConfirmPw(e.target.value)} placeholder="••••••••" />
                </div>
                <button className="btn-primary" type="submit" disabled={pwBusy}>{pwBusy ? "Saving…" : "Update password"}</button>
              </form>
            </React.Fragment>
          )}
        </div>
      </div>
    );
  }

  return user ? <Shell user={user} onSignOut={handleSignOut} /> : <Auth onSignedIn={setUser} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
